<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visit Armenia</title>
    <!-- Només la llibreria de Bootstrap 5 oficial -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="p-3">

    <!-- CONTENIDOR PRINCIPAL -->
    <div class="container text-center">
      <h1 class="mb-4">Visit Armenia</h1>

      <!-- FILA 1: 3 columnes iguals (col) -->
      <div class="row mb-3">
        <div class="col border p-3">col 1</div>
        <div class="col border p-3">col 2</div>
        <div class="col border p-3">col 3</div>
      </div>

      <!-- FILA 2: Columnes que sumen 12 (3 + 6 + 3) -->
      <div class="row mb-3">
        <div class="col-3 border p-3">col 3/12</div>
        <div class="col-6 border p-3">col 6/12</div>
        <div class="col-3 border p-3">col 3/12</div>
      </div>

      <!-- FILA 3: Ample complet (12) -->
      <div class="row">
        <div class="col-12 border p-3">col 12/12</div>
      </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
